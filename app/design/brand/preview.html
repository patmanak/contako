<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contako — artwork preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeef3;color:#191927;font:16px system-ui,sans-serif;padding:32px}main{max-width:960px;margin:auto}h1{font-size:26px;margin:0 0 10px}p{color:#666477;line-height:1.6}section{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}.card{padding:28px 16px;background:white;border-radius:24px;min-width:0}.dark{background:#191927;color:#f4f3fb}.label{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;margin:0 0 26px 14px;opacity:.7}.brand{width:min(100%,380px);margin:auto;display:flex;align-items:center;container-type:inline-size}.brand img{width:100%;height:auto}.word{font-size:12cqw;font-weight:700;white-space:nowrap;letter-spacing:0}.accent{color:#6d4aff}.dark .accent{color:#c4b7ff}.icons{display:flex;gap:22px;align-items:center;justify-content:center;margin-top:30px}.icon{width:80px;height:80px;background:#f7f7fa;display:grid;place-items:center;overflow:hidden}.icon img{width:60%;height:60%;object-fit:contain}.circle{border-radius:50%}.squircle{border-radius:24%}.dark .icon{background:#202127}.small{width:48px;height:48px}.hero{display:block;width:min(80%,280px);margin:30px auto 0}.note{font-size:13px;margin-top:26px}@media(max-width:600px){body{padding:20px}section{grid-template-columns:1fr}}
</style>
<main><h1>One mascot, two themes</h1><p>Intertwined wordmarks on transparent backgrounds, with the subtitle “Contact for Proton”. The launcher uses a separate mascot graphic.</p>
<section><div class="card"><div class="label">Light theme</div><div class="brand"><img src="../../src/main/res/drawable-nodpi/contako_brand_light.png" alt="Contako — Contact for Proton"></div><div class="icons"><div class="icon circle"><img src="../../src/main/res/drawable-nodpi/contako_mascot_v2.png" alt="Round icon"></div><div class="icon squircle"><img src="../../src/main/res/drawable-nodpi/contako_mascot_v2.png" alt="Rounded-square icon"></div><div class="icon circle small"><img src="../../src/main/res/drawable-nodpi/contako_mascot_v2.png" alt="48-pixel icon"></div></div><img class="hero" src="../../src/main/res/drawable-nodpi/contako_mascot_v2.png" alt="Mascot on a white background"></div>
<div class="card dark"><div class="label">Dark theme</div><div class="brand"><img src="../../src/main/res/drawable-nodpi/contako_brand_dark.png" alt="Contako — Contact for Proton"></div><div class="icons"><div class="icon circle"><img src="../../src/main/res/drawable-nodpi/contako_mascot_v2.png" alt="Round icon"></div><div class="icon squircle"><img src="../../src/main/res/drawable-nodpi/contako_mascot_v2.png" alt="Rounded-square icon"></div><div class="icon circle small"><img src="../../src/main/res/drawable-nodpi/contako_mascot_v2.png" alt="48-pixel icon"></div></div><img class="hero" src="../../src/main/res/drawable-nodpi/contako_mascot_v2.png" alt="Mascot on a dark background"></div></section>
<p class="note">The Android monochrome icon is retained. Proton and Patmanak marks are unchanged.</p></main></html>
